name: StopWatch firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    defaults:
      run:
        shell: bash
        working-directory: esp32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          echo "CONFIG_MUSE_CJK_FONT=y" > devices/sdkconfig.local-cjk
          echo "CONFIG_MUSE_LOCAL_TTS=y" >> devices/sdkconfig.local-cjk
          mkdir -p components/muse/avatar
          cp ../custom-avatar/muse_pixel.c components/muse/avatar/muse_pixel.c
          idf.py -B build -DIDF_TARGET=esp32s3 -DSDKCONFIG=build/sdkconfig \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-stopwatch;devices/sdkconfig.local-cjk" build
          grep -E "^CONFIG_MUSE_(CJK_FONT|HATCH|REALTIME_VOICE|LOCAL_TTS)=" build/sdkconfig
          idf.py -B build size | tail -n 20

      - name: Collect
        run: |
          mkdir -p out
          cd build
          cp flash_args flasher_args.json ../out/
          for f in $(grep -oE '[^ ]+\.bin' flash_args); do mkdir -p "../out/$(dirname "$f")"; cp "$f" "../out/$f"; done
          ls -lR ../out

      - uses: actions/upload-artifact@v4
        with:
          name: stopwatch-firmware
          path: esp32/out/
          retention-days: 7
